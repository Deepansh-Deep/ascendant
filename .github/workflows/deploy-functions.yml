name: Deploy server functions

# Installs the Supabase edge functions (leaderboard scoring, gym logo upload, owner tools).
# Needs ONE repository secret: SUPABASE_ACCESS_TOKEN
#   (supabase.com > Account > Access Tokens > Generate new token).
# Runs when function code changes, or by hand from the Actions tab.
on:
  push:
    branches: [ main ]
    paths: [ 'supabase/functions/**' ]
  workflow_dispatch:

env:
  PROJECT_REF: ohxwgnffhmpvixbgrceb

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the token is set
        run: '[ -n "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ] || { echo "Add the SUPABASE_ACCESS_TOKEN secret first. See the README, Going live."; exit 1; }'
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # The functions check the user's token themselves (getUser), so the platform JWT check is off.
        # That check does not work with Supabase's new signing keys.
        run: |
          for f in compute-scores upload-logo owner-admin; do
            supabase functions deploy "$f" --project-ref "$PROJECT_REF" --no-verify-jwt --use-api --yes
          done
