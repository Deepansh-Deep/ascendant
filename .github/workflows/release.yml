name: Release Android APK

# Push a tag like v2.1.0 to publish a signed APK on GitHub Releases.
# The website's download page and the app's update check pick it up automatically.
# Needs four repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version numbers match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "const VERSION = \"$TAG\"" www/js/core.js || { echo "www/js/core.js VERSION is not $TAG"; exit 1; }
          [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] || { echo "Signing secrets are missing. See the README, 'Signing key'."; exit 1; }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Install and sync
        run: |
          npm ci || npm install
          npx cap sync android
      - name: Build signed release APK
        working-directory: android
        env:
          ASC_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ASC_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ASC_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/ascendant.jks"
          export ASC_KEYSTORE="$RUNNER_TEMP/ascendant.jks"
          V="${GITHUB_REF_NAME#v}"; IFS=. read -r MA MI PA <<< "$V"
          export ASC_VERSION_NAME="$V" ASC_VERSION_CODE=$((MA*10000 + MI*100 + PA))
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/ascendant-$V.apk"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/ascendant.apk"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ascendant-*.apk
            ascendant.apk
          generate_release_notes: true

  site:
    needs: apk
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
