<!doctype html>
<html lang="en" data-theme="gold">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0F12">
<meta name="description" content="Ascendant: the gym tracker where a 3D hunter evolves with your real training. Log sets, earn XP, compete with your gym.">
<title>Ascendant</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/sora-variable.woff2" as="font" type="font/woff2" crossorigin>

<link rel="modulepreload" href="vendor/three-bundle.js">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main class="app" id="app" aria-live="polite"></main>
<div id="pbar"></div>
<div id="timer"></div>
<nav class="nav" id="nav" aria-label="Main"></nav>
<div id="layer"></div>
<div id="cer"></div>

<input type="file" id="logoFile" accept="image/png,image/jpeg,image/webp" hidden>
<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/ui.js"></script>
<script src="js/scoring.js"></script>
<script src="js/cloud.js"></script>

<script src="js/views.js"></script>

</html>
